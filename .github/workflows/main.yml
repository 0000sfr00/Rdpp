# =============================
# CONFIG
# =============================
$UserName = "TOOLBOXLAP"
$Password = "admin@123"
$TailscaleAuthKey = "<tskey-auth-kVQ7kyvHrX11CNTRL-CWy5mSxAAsNrJhuB7GpGrNGihXivAjFQB>"  # Tailscale auth key
$RuntimeDays = 3
$CheckInterval = 30  # saniye

# =============================
# FUNCTION: Configure RDP
# =============================
Write-Host "Configuring RDP..."
Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
netsh advfirewall firewall delete rule name="RDP-Tailscale" -ErrorAction SilentlyContinue
netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
Restart-Service -Name TermService -Force

# =============================
# FUNCTION: Create User
# =============================
Write-Host "Creating RDP user..."
$securePass = ConvertTo-SecureString $Password -AsPlainText -Force
if (-not (Get-LocalUser -Name $UserName -ErrorAction SilentlyContinue)) {
    New-LocalUser -Name $UserName -Password $securePass -AccountNeverExpires
}
Add-LocalGroupMember -Group "Administrators" -Member $UserName
Add-LocalGroupMember -Group "Remote Desktop Users" -Member $UserName

# =============================
# FUNCTION: Install Tailscale
# =============================
Write-Host "Installing Tailscale..."
$tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
$installerPath = "$env:TEMP\tailscale.msi"
Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
Start-Process msiexec.exe -ArgumentList "/i", "$installerPath", "/quiet", "/norestart" -Wait
Remove-Item $installerPath -Force

# =============================
# FUNCTION: Start Tailscale
# =============================
function Start-Tailscale {
    Write-Host "Starting Tailscale..."
    & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$TailscaleAuthKey --hostname=$env:COMPUTERNAME
}

# =============================
# MAIN LOOP
# =============================
$EndTime = (Get-Date).AddDays($RuntimeDays)
Start-Tailscale

while ((Get-Date) -lt $EndTime) {
    try {
        $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
        if (-not $tsIP) {
            Write-Host "Tailscale not connected. Retrying..."
            Start-Tailscale
        } else {
            Write-Host "[$(Get-Date)] Tailscale IP: $tsIP | RDP Ready"
        }
    } catch {
        Write-Warning "Error checking Tailscale: $_"
        Start-Tailscale
    }
    Start-Sleep -Seconds $CheckInterval
}

Write-Host "3 days runtime completed."
